<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拍照識客字</title>
<meta name="copyright" content="鑫宥嘉有限公司 版權所有">
<meta name="author" content="鑫宥嘉有限公司">
<meta name="description" content="用手機拍下客語文字，自動辨識出客語漢字，標上拼音、用六腔（四縣、海陸、大埔、饒平、詔安、南四縣）唸出來，並列出辭典解釋；可收藏到我的最愛並定期複習。">
<meta name="theme-color" content="#b4492b">
<style>
:root{
  --bg:#f7f3ea; --card:#fffdf8; --ink:#2b2a26; --sub:#6b675c; --line:#e3dcc9;
  --brand:#b4492b; --brand-ink:#ffffff; --good:#2f7d4f; --good-bg:#e3f3e8;
  --bad:#b3261e; --bad-bg:#fbe6e3; --hint:#f3e6b8; --chip:#efe8d6; --zh:#2b5d8a; --zh-bg:#e6eef6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1a17; --card:#26241f; --ink:#f1ece0; --sub:#a9a392; --line:#3a372e;
    --brand:#e0714f; --brand-ink:#1b1a17; --good:#6fcf97; --good-bg:#1f3a2a;
    --bad:#ff8a80; --bad-bg:#3d2220; --hint:#4a4120; --chip:#34312a; --zh:#8cb8e0; --zh-bg:#1f2c38; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1a17; --card:#26241f; --ink:#f1ece0; --sub:#a9a392; --line:#3a372e;
  --brand:#e0714f; --brand-ink:#1b1a17; --good:#6fcf97; --good-bg:#1f3a2a;
  --bad:#ff8a80; --bad-bg:#3d2220; --hint:#4a4120; --chip:#34312a; --zh:#8cb8e0; --zh-bg:#1f2c38; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:8px;min-height:52px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;min-height:40px}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.btn.sm{padding:4px 10px;min-height:32px;font-size:14px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
select.btn{padding-right:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.muted{color:var(--sub);font-size:14px}
.hide{display:none!important}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex}
nav.tabs button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button b{font-size:22px;line-height:1;font-weight:400}
nav.tabs button[aria-current="page"]{color:var(--brand);font-weight:600}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:9px;font-size:11px;min-width:18px;padding:0 5px;line-height:18px}

/* 相機 */
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-height:62vh;margin:12px auto 0;display:flex;align-items:center;justify-content:center}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#eee;text-align:center;padding:24px;font-size:15px}
.shutter{display:flex;justify-content:center;align-items:center;gap:18px;margin:14px 0}
.shoot{width:72px;height:72px;border-radius:50%;border:5px solid var(--brand);background:var(--card);font-size:28px}
.shoot:active{transform:scale(.95)}

/* 結果 */
.res .zh,.res .hk{border-radius:12px;padding:10px 12px;text-align:center}
.res .zh{background:var(--zh-bg);margin-bottom:10px}
.res .hk{background:var(--hint);margin-top:10px}
.lab{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;align-items:center;gap:8px}
.word{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 10px;margin:4px 0}
.ch{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.ch .c{font-size:44px;font-weight:700}
.ch .r{font-size:15px;color:var(--sub);min-height:1.2em;letter-spacing:1px}
.zh .ch .c{color:var(--zh)}
.hk .ch .c{color:var(--brand)}
.pron{font-size:20px;font-weight:600;letter-spacing:.5px}
.say{border:0;background:var(--card);border-radius:999px;padding:6px 16px;min-height:40px;font-weight:600;box-shadow:0 1px 0 var(--line)}
.say.on{outline:3px solid var(--brand)}
.photo{position:relative;border-radius:12px;overflow:hidden;background:#000}
.photo img,.photo canvas{display:block;width:100%;height:auto;max-height:52vh;object-fit:contain}
.photo .box{position:absolute;border:3px solid #ffd54a;border-radius:6px;box-shadow:0 0 0 1px #0006}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.note{font-size:13px;color:var(--sub);margin-top:6px}
.busy{display:flex;align-items:center;gap:10px;justify-content:center;padding:18px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* 我的最愛 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fav{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0}
.fav .th{aspect-ratio:1;background:var(--chip) center/cover no-repeat}
.fav .tx{padding:6px 8px}
.fav .t1{font-weight:700}
.fav .t2{font-size:13px;color:var(--sub)}
.dots{display:flex;gap:3px;margin-top:3px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.due{color:var(--bad);font-weight:600}
.empty{text-align:center;color:var(--sub);padding:28px 8px}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--sub);font-weight:500}
.tbl{overflow-x:auto}

/* 對話框 */
.modal{position:fixed;inset:0;z-index:50;background:#0008;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:720px){.modal{align-items:center}.modal .sheet{border-radius:16px}}
.sheet h2{font-size:18px;margin:4px 0 10px;display:flex;justify-content:space-between;align-items:center}
label.f{display:block;font-size:14px;color:var(--sub);margin:10px 0 4px}
input.f,select.f{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;min-height:44px}
.err{color:var(--bad);font-size:14px;min-height:1.4em;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.pick button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;font-size:15px}
.pick button small{display:block;color:var(--sub);font-size:12px}
.revcard{text-align:center}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--good)}
footer{text-align:center;color:var(--sub);font-size:12px;padding:20px 0 8px}
footer a{color:inherit}

/* 拍照識客字 */
.aim{position:absolute;left:8%;right:8%;top:30%;height:40%;border:3px dashed #ffd54a;border-radius:10px;box-shadow:0 0 0 9999px #0004;pointer-events:none}
.photo{text-align:center}
.photo .pin{position:relative;display:inline-block;max-width:100%;vertical-align:top}
.photo .pin img{display:block;max-width:100%;max-height:52vh;width:auto;height:auto}
.hk.top{background:var(--hint);border-radius:12px;padding:10px 12px;text-align:center;margin-bottom:10px}
.seg{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:2px 4px;border:0;background:var(--card);border-radius:10px;padding:4px 6px;box-shadow:0 1px 0 var(--line)}
.seg.punct{background:none;box-shadow:none;font-size:30px;align-self:center}
.seg.guess{outline:2px dashed var(--sub);outline-offset:-2px}
.seg.on{outline:3px solid var(--brand)}
.seg .ch .c{color:var(--brand)}
.seg .r.whole{flex-basis:100%;text-align:center;font-size:15px;color:var(--sub)}
.word .ch .c{font-size:clamp(28px,9vw,44px)}
.fix{margin-top:10px}
.dsel{justify-content:center;margin-bottom:6px}
.dh{font-size:16px;margin:14px 0 6px}
.def{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card);transition:background .3s}
.def.flash{background:var(--hint)}
.def .dw{font-size:22px;font-weight:700;color:var(--ink)}
.rd{margin-top:6px}
.rd.alt{opacity:.8;border-top:1px dashed var(--line);padding-top:6px}
.rdh b{font-size:17px}
.rd ol{margin:4px 0;padding-left:22px}
.rd li{margin:2px 0}
.pos{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--sub)}
.ex{font-size:14px;color:var(--sub)}
.sub{border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
.big{font-size:24px;color:var(--brand)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>🔤 拍照識客字</h1>
  <select id="dialect" class="btn sm" aria-label="客語腔調"></select>
  <button id="btnAuth" class="btn sm">登入</button>
</div></header>

<main class="wrap">
  <!-- 拍照 -->
  <section id="vCam">
    <div id="camBox">
      <div class="cam" id="cam">
        <video id="video" playsinline muted autoplay></video>
        <div class="aim hide" id="aim"></div>
        <div class="msg" id="camMsg">按下「開啟相機」對準客語文字拍照，<br>或從相簿選一張照片。</div>
      </div>
      <div class="shutter">
        <label class="btn" title="從相簿選照片">🖼️ 相簿<input id="file" type="file" accept="image/*" class="hide"></label>
        <button class="shoot" id="btnShoot" aria-label="開啟相機">📷</button>
        <button class="btn" id="btnFlip" title="切換前後鏡頭">🔄 鏡頭</button>
      </div>
      <p class="muted" id="modelMsg" style="text-align:center">文字辨識程式載入中…（第一次約需 10～20 秒）</p>
      <div class="card">
        <label class="f" for="typeIn" style="margin-top:0">沒有相機？也可以直接輸入客語漢字查詢</label>
        <div class="row"><input class="f grow" id="typeIn" maxlength="30" placeholder="例如：汽車、食飯、學校" style="width:auto"><button class="btn pri" id="btnType">查詢</button></div>
      </div>
    </div>

    <div id="resBox" class="hide">
      <div class="card res" id="res"></div>
      <div class="row" id="acts" style="justify-content:center;margin:12px 0">
        <button class="btn pri" id="btnFav">⭐ 加入我的最愛</button>
        <button class="btn" id="btnAgain">📷 再拍一張</button>
      </div>
    </div>
  </section>

  <!-- 我的最愛 -->
  <section id="vFav" class="hide">
    <div class="row" style="margin-top:12px">
      <h2 class="grow" style="font-size:18px;margin:0">⭐ 我的最愛</h2>
      <select id="favFilter" class="btn sm" aria-label="篩選">
        <option value="all">全部</option><option value="due">今天要複習</option><option value="doing">複習中</option><option value="done">已完成 5 次</option>
      </select>
    </div>
    <div id="dueBanner"></div>
    <div id="favList"></div>
  </section>

  <!-- 複習 -->
  <section id="vRev" class="hide"><div id="revBody"></div></section>

  <!-- 群組 -->
  <section id="vGrp" class="hide"><div id="grpBody"></div></section>

  <footer>© 2026 鑫宥嘉有限公司｜客語音讀、錄音與釋義取自教育部《臺灣客語辭典》與《臺灣客家語常用詞辭典》｜<a href="../">客語字音字形練習</a>・<a href="../objcam/">拍照學客語</a></footer>
</main>

<nav class="tabs"><div class="wrap">
  <button data-tab="vCam" aria-current="page"><b>📷</b>拍照</button>
  <button data-tab="vFav"><b>⭐</b>我的最愛</button>
  <button data-tab="vRev"><b>🔁</b>複習<span class="badge hide" id="dueBadge"></span></button>
  <button data-tab="vGrp"><b>👥</b>群組</button>
</div></nav>

<div class="modal hide" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
/* ================= 設定 ================= */
const SB_URL="https://ktsmglzfefzqhcuomkll.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0c21nbHpmZWZ6cWhjdW9ta2xsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5ODk1ODIsImV4cCI6MjEwNjU2NTU4Mn0.lUqXBvu08UcNbUG4oprHgB-vDdq1NVybJeIF-fjJZR0";
const BUCKET="hakkaocr";
const AUDIO_BASE="https://hakkadict.moe.edu.tw/static/audio/";
const MOEDICT="https://www.moedict.tw/:";
const OCR_LANG="https://cdn.jsdelivr.net/npm/@tesseract.js-data/chi_tra@1.0.0/4.0.0_best_int";
const MAX_REVIEW=5;
/* 各腔調的聲調符號（依教育部《臺灣客語辭典》）：調值 → [調名, 符號]；與主網站相同 */
const DIAL={
  1:{n:"四縣腔",t:{"24":["陰平","ˊ"],"11":["陽平","ˇ"],"31":["上聲","ˋ"],"55":["去聲",""],"2":["陰入","ˋ"],"5":["陽入",""]}},
  2:{n:"海陸腔",t:{"53":["陰平","ˋ"],"55":["陽平",""],"24":["上聲","ˊ"],"11":["陰去","ˇ"],"33":["陽去","+"],"5":["陰入",""],"2":["陽入","ˋ"]}},
  3:{n:"大埔腔",t:{"33":["陰平","+"],"31":["上聲","^"],"53":["去聲","ˋ"],"113":["陽平","ˇ"],"21":["陰入","^"],"54":["陽入","ˋ"],"35":["變調","ˊ"]}},
  4:{n:"饒平腔",t:{"11":["陰平","ˇ"],"53":["上聲","ˋ"],"55":["陽平",""],"24":["去聲","ˊ"],"2":["陰入","ˋ"],"5":["陽入",""]}},
  5:{n:"詔安腔",t:{"11":["陰平","ˇ"],"31":["上聲","^"],"53":["陽平","ˋ"],"55":["去聲",""],"24":["陰入","ˊ"],"43":["陽入","ˋ"]}},
  6:{n:"南四縣腔",t:{"24":["陰平","ˊ"],"11":["陽平","ˇ"],"31":["上聲","ˋ"],"55":["去聲",""],"2":["陰入","ˋ"],"5":["陽入",""]}}
};
const SRC_NOTE=["教育部《臺灣客語辭典》整詞錄音","拼音依《臺灣客家語常用詞辭典》，錄音逐字播放","辭典沒有收這個詞，依單字音組合，僅供參考"];
const HAN=/[㐀-鿿豈-﫿\u{20000}-\u{3134f}]/u;

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2600)}
function uuid(){return crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c=="x"?r:(r&3|8)).toString(16)})}
const p2=n=>String(n).padStart(2,"0");
const fmtD=t=>{if(!t)return "—";const d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate()};
const fmtT=t=>{if(!t)return "—";const d=new Date(t);return d.getFullYear()+"/"+p2(d.getMonth()+1)+"/"+p2(d.getDate())};
function startOfDay(t){const d=new Date(t);d.setHours(0,0,0,0);return d}
function addDays(n){const d=startOfDay(Date.now());d.setDate(d.getDate()+n);return d.toISOString()}
const auUrl=n=>AUDIO_BASE+n+(/\.(mp3|wav)$/.test(n)?"":".mp3");
const DN=d=>DIAL[d].n;

/* 數字調 → 調號：hi55 ca24 → hi ca24ˊ */
function markPron(p,d){
  const t=DIAL[d].t;
  return String(p||"").split(" ").map(s=>{const m=s.match(/^([a-z]+)(\d+)$/);return m?m[1]+(t[m[2]]?t[m[2]][1]:""):s}).join(" ");
}

/* ================= 狀態 ================= */
let AUTH=lsGet("ho_auth",null);   // {access,refresh,exp,uid,email}
let PROFILE=null;                 // hakkaocr_profiles
let DIALECT=lsGet("ho_dialect",1);
let OPT=Object.assign({sound:true,pinyin:true},lsGet("ho_opt",{}));   // 自動發音、顯示拼音
let FAVS=[];                      // 我的最愛
let CUR=null;                     // 目前結果 {img,blob,w,h,lines:[{text,syms,box,h,conf}],pick,text,box}
let curTab="vCam";

/* ================= Supabase REST ================= */
function hdr(extra){return Object.assign({apikey:SB_KEY,Authorization:"Bearer "+(AUTH?AUTH.access:SB_KEY),"Content-Type":"application/json"},extra||{})}
function applySession(j){
  const u=j.user||{};
  AUTH={access:j.access_token,refresh:j.refresh_token,exp:Math.floor(Date.now()/1000)+(j.expires_in||3600),uid:u.id||(AUTH&&AUTH.uid),email:u.email||(AUTH&&AUTH.email)};
  lsSet("ho_auth",AUTH);
}
async function ensureToken(){
  if(!AUTH)return false;
  if(AUTH.exp-60>Date.now()/1000)return true;
  try{
    const r=await fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:AUTH.refresh})});
    if(r.status===400||r.status===401){signOut(true);toast("登入已過期，請重新登入");return false}
    if(!r.ok)return false;
    applySession(await r.json());return true;
  }catch(e){return false}
}
async function api(path,opt){
  opt=opt||{};
  if(!(await ensureToken()))throw new Error("請先登入");
  const r=await fetch(SB_URL+"/rest/v1/"+path,{method:opt.method||"GET",headers:hdr(opt.headers),body:opt.body!==undefined?JSON.stringify(opt.body):undefined});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error((j&&(j.message||j.hint||j.details))||("HTTP "+r.status));
  return j;
}
const rpc=(fn,args)=>api("rpc/"+fn,{method:"POST",body:args||{}});
async function uploadPhoto(path,blob){

const SIGNED={};   // path → {url,exp}
async function signPhotos(paths){
  const need=[...new Set(paths)].filter(p=>!SIGNED[p]||SIGNED[p].exp<Date.now()+60000);
  if(!need.length||!(await ensureToken()))return;
  const r=await fetch(SB_URL+"/storage/v1/object/sign/"+BUCKET,{method:"POST",headers:hdr(),body:JSON.stringify({expiresIn:3600,paths:need})});
  if(!r.ok)return;
  (await r.json()).forEach(x=>{if(x.signedURL)SIGNED[x.path]={url:SB_URL+"/storage/v1"+x.signedURL,exp:Date.now()+3500*1000}});
}

function zhErr(m){
  m=String(m&&m.message||m);
  const map={CODE_NOT_FOUND:"找不到這個群組代碼，請確認是否輸入正確。",NOT_OWNER:"只有群組擁有者可以做這件事。",NOT_MANAGER:"只有群組擁有者或管理員可以做這件事。",BAD_ROLE:"無法變更這位成員的角色。",NOT_LOGGED_IN:"請先登入。"};
  for(const k in map)if(m.includes(k))return map[k];
  if(/Invalid login credentials/i.test(m))return "信箱或密碼不正確。";
  if(/Email not confirmed/i.test(m))return "這個信箱還沒完成驗證，請先到信箱點確認連結。";
  if(/already registered|already been registered/i.test(m))return "這個信箱已經註冊過，請直接登入。";
  if(/at least 6|weak|Password should/i.test(m))return "密碼太短或太弱，請至少 6 個字元。";
  if(/rate limit|security purposes/i.test(m))return "操作太頻繁，請稍後再試。";

const player=new Audio();player.preload="auto";
let playToken=0,sayBtn=null;
function markBtn(b){if(sayBtn)sayBtn.classList.remove("on");sayBtn=b||null;if(sayBtn)sayBtn.classList.add("on")}
function stopAll(){playToken++;player.pause();markBtn(null)}
function playOne(url,tok){
  return new Promise(res=>{
    if(tok!==playToken)return res(false);
    const fin=ok=>{player.onended=player.onerror=null;res(ok)};
    player.onended=()=>fin(true);player.onerror=()=>fin(false);
    player.src=url;player.play().catch(()=>fin(false));
  });
}
/* 依序播放一串錄音檔；segs=[{a:[檔名]}]，段與段之間稍微停頓 */
async function playSegs(segs,btn){
  stopAll();const tok=playToken;markBtn(btn);
  const list=segs.filter(s=>s.a&&s.a.length);
  if(!list.length){toast("這段文字在"+DN(DIALECT)+"暫時沒有錄音");markBtn(null);return}
  if(list.length<segs.length)toast("部分字詞在此腔調沒有錄音，已略過");
  for(const s of list){
    for(const a of s.a){
      if(tok!==playToken)return;
      const ok=await playOne(auUrl(a),tok);
      if(!ok){if(tok===playToken){toast("客語錄音播放失敗，請檢查網路");markBtn(null)}return}
      if(s.a.length>1)await new Promise(r=>setTimeout(r,80));
    }
    await new Promise(r=>setTimeout(r,280));
  }
  if(tok===playToken)markBtn(null);
}

/* ================= 辭典 ================= */
/* dict.json：{詞:[[拼音×6, 錄音×6 或含 # 的樣板, [釋義], [例句], 詞性, 來源], ...]} */
let DB=null,MAXW=1,dbReady=null;
function loadDict(){
  if(dbReady)return dbReady;
  dbReady=fetch("dict.json").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(j=>{
    DB=j;MAXW=Math.max(...Object.keys(j).map(k=>[...k].length));return j;
  }).catch(e=>{dbReady=null;throw e});
  return dbReady;
}
const rdAudio=(r,d)=>typeof r[1]==="string"?r[1].replace("#",d):r[1][d-1];
/* 單字在某腔調的讀音：可指定要的拼音（找相同音的錄音） */
function charReading(c,d,want){
  const rs=DB[c]||[];
  const cand=rs.filter(r=>r[0][d-1]&&!/ /.test(r[0][d-1]));
  const hit=want?cand.find(r=>r[0][d-1]===want&&rdAudio(r,d)):(cand.find(r=>rdAudio(r,d))||cand[0]);
  return hit?{p:hit[0][d-1],a:rdAudio(hit,d)}:null;
}
/* 把一段文字切成辭典詞（動態規劃：盡量用長詞） */
function segment(text){
  const cs=[...text],n=cs.length,best=Array(n+1).fill(-1),from=Array(n+1).fill(0);best[0]=0;
  for(let i=0;i<n;i++){
    if(best[i]<0)continue;
    for(let L=1;L<=Math.min(MAXW,n-i);L++){
      const w=cs.slice(i,i+L).join("");
      const known=DB[w]&&HAN.test(cs[i]);
      if(L>1&&!known)continue;
      const sc=best[i]+(known?L*L:0);
      if(sc>best[i+L]){best[i+L]=sc;from[i+L]=i}
    }
  }
  const out=[];let j=n;
  while(j>0){const i=from[j];out.unshift(cs.slice(i,j).join(""));j=i}
  // 相鄰的非漢字合併（標點、數字）
  const segs=[];
  out.forEach(w=>{const han=HAN.test(w);const last=segs[segs.length-1];if(!han&&last&&!last.han)last.w+=w;else segs.push({w,han})});
  return segs;
}
/* 某詞在某腔調的讀音與錄音：s=0 整詞錄音、1 常用詞辭典拼音逐字錄音、2 單字組合 */
function hakkaOf(w,d){
  const rs=DB[w]||[];
  const r=rs.find(r=>r[0][d-1]&&rdAudio(r,d))||rs.find(r=>r[0][d-1]);
  if(r){
    const p=r[0][d-1],au=rdAudio(r,d);
    if(au)return {w,p,a:[au],s:0,r};
    const syl=p.split(" "),cs=[...w];
    let a=[];
    if(syl.length===cs.length){a=cs.map((c,i)=>{const x=charReading(c,d,syl[i]);return x&&x.a});if(!a.every(Boolean))a=[]}
    return {w,p,a,s:1,r};
  }
  const cs=[...w],ps=[],as=[];
  for(const c of cs){const x=charReading(c,d);if(!x)return {w,p:"",a:[],s:2,r:null};ps.push(x.p);if(x.a)as.push(x.a)}
  return {w,p:ps.join(" "),a:as.length===cs.length?as:[],s:2,r:null};
}
function analyze(text,d){
  return segment(text).map(sg=>sg.han?Object.assign({han:true},hakkaOf(sg.w,d)):{w:sg.w,han:false,p:"",a:[],s:-1});
}
function shortGloss(segs){
  for(const s of segs){if(s.r&&s.r[2]&&s.r[2][0])return (s.w+"："+s.r[2][0]).slice(0,200)}
  return "";
}

/* ================= 文字辨識（Tesseract.js，繁體中文） ================= */
let worker=null,ocrReady=null;
function loadOCR(){
  if(ocrReady)return ocrReady;
  ocrReady=(async()=>{
    try{
      if(!window.Tesseract)throw new Error("文字辨識程式庫載入失敗");
      worker=await Tesseract.createWorker("chi_tra",1,{langPath:OCR_LANG,logger:m=>{
        if(m.status&&/loading|initializ/.test(m.status)&&m.progress<1)$("#modelMsg").textContent="文字辨識程式載入中… "+Math.round((m.progress||0)*100)+"%";
      }});
      $("#modelMsg").textContent="準備好了！把客語文字放進黃色框框裡，按下拍照鍵。";
      return true;
    }catch(e){
      console.warn(e);ocrReady=null;
      $("#modelMsg").textContent="文字辨識程式載入失敗，請檢查網路後重新整理頁面。";
      throw e;
    }
  })();
  return ocrReady;
}
/* 縮放到指定倍率並轉灰階、拉高對比 */
function prepCanvas(src,s){
  const c=document.createElement("canvas");c.width=Math.max(1,Math.round(src.width*s));c.height=Math.max(1,Math.round(src.height*s));
  const g=c.getContext("2d");g.imageSmoothingQuality="high";g.drawImage(src,0,0,c.width,c.height);
  const im=g.getImageData(0,0,c.width,c.height),px=im.data,hist=new Uint32Array(256);
  for(let i=0;i<px.length;i+=4){const y=(px[i]*299+px[i+1]*587+px[i+2]*114)/1000|0;px[i]=y;hist[y]++}
  const tot=px.length/4;let lo=0,hi=255,acc=0;
  for(;lo<255;lo++){acc+=hist[lo];if(acc>tot*.02)break}
  acc=0;for(;hi>0;hi--){acc+=hist[hi];if(acc>tot*.02)break}
  const k=hi>lo?255/(hi-lo):1;
  for(let i=0;i<px.length;i+=4){const v=Math.max(0,Math.min(255,(px[i]-lo)*k));px[i]=px[i+1]=px[i+2]=v}
  g.putImageData(im,0,0);return c;
}
/* 一次辨識：回傳每一行的漢字、信心度、字高（原圖像素）與位置（0~1） */
async function ocrPass(src,scale,psm){
  const pc=prepCanvas(src,scale);
  await worker.setParameters({tessedit_pageseg_mode:psm});
  const {data}=await worker.recognize(pc,{},{blocks:true,text:false});
  const lines=[];
  (data.blocks||[]).forEach(b=>b.paragraphs.forEach(p=>p.lines.forEach(l=>{
    const sy=[];
    l.words.forEach(w=>w.symbols.forEach(s=>{const t=(s.text||"").trim();if(t&&HAN.test(t))sy.push({t,c:s.confidence,b:s.bbox})}));
    if(!sy.length)return;
    const conf=sy.reduce((a,s)=>a+s.c,0)/sy.length;
    if(conf<45||(sy.length===1&&sy[0].c<70))return;   // 雜訊
    const hs=sy.map(s=>s.b.y1-s.b.y0).sort((a,b)=>a-b),h=hs[hs.length>>1]/scale;
    const x0=Math.min(...sy.map(s=>s.b.x0)),y0=Math.min(...sy.map(s=>s.b.y0)),x1=Math.max(...sy.map(s=>s.b.x1)),y1=Math.max(...sy.map(s=>s.b.y1));
    const W=pc.width,H=pc.height,pad=.01;
    lines.push({text:sy.map(s=>s.t).join(""),syms:sy.map(s=>({t:s.t,c:Math.round(s.c)})),conf,h,
      box:[Math.max(0,x0/W-pad),Math.max(0,y0/H-pad),Math.min(1,(x1-x0)/W+2*pad),Math.min(1,(y1-y0)/H+2*pad)]});
  })));
  return lines;
}
/* 結果好壞：辭典裡找得到的多字詞加分，再乘上信心度 */
function passScore(lines){
  let s=0;
  lines.forEach(l=>{let v=0;segment(l.text).forEach(g=>{if(!g.han)return;const L=[...g.w].length;v+=L>1?L*1.5:(DB[g.w]?.6:.2)});s+=v*l.conf/100});
  return s;
}
/* 同一張圖用不同大小、版面模式辨識幾次，取最好的結果（字太大或太小都會降低準確度） */
async function ocr(canvas,onStep){
  await loadOCR();
  const W=canvas.width,H=canvas.height;
  const s1=Math.min(2,Math.max(1,900/Math.min(W,H)));
  onStep&&onStep(1);
  let best=await ocrPass(canvas,s1,"3"),bestS=passScore(best);
  const domH=best.length?Math.max(...best.map(l=>l.h)):0;
  const targets=domH?[44,30]:[0,0];
  for(let k=0;k<targets.length;k++){
    const avg=best.length?best.reduce((a,l)=>a+l.conf,0)/best.length:0;
    if(best.length&&avg>=90&&k>0)break;
    const sc=targets[k]?Math.min(2,Math.max(.15,targets[k]/domH)):(k?500:800)/Math.max(W,H);
    onStep&&onStep(k+2);
    const r=await ocrPass(canvas,sc,"11"),rs=passScore(r);
    if(rs>bestS){best=r;bestS=rs}
  }
  const lines=best;
  if(!lines.length)return lines;
  // 字最大（最顯眼）的幾行依由上而下合成主要結果，其餘列為候選
  const maxH=Math.max(...lines.map(l=>l.h));
  const big=lines.filter(l=>l.h>=maxH*.8).sort((a,b)=>a.box[1]-b.box[1]);
  const rest=lines.filter(l=>!big.includes(l)).sort((a,b)=>b.h-a.h);
  const out=big.length>1?[mergeLines(big)].concat(big,rest):big.concat(rest);
  return out.slice(0,8);
}
function mergeLines(ls){
  const x0=Math.min(...ls.map(l=>l.box[0])),y0=Math.min(...ls.map(l=>l.box[1]));
  const x1=Math.max(...ls.map(l=>l.box[0]+l.box[2])),y1=Math.max(...ls.map(l=>l.box[1]+l.box[3]));
  return {text:ls.map(l=>l.text).join("").slice(0,30),syms:[].concat(...ls.map(l=>l.syms)),conf:ls.reduce((a,l)=>a+l.conf,0)/ls.length,h:ls[0].h,box:[x0,y0,x1-x0,y1-y0]};
}

/* ================= 相機 ================= */
let stream=null,facing="environment";
async function openCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("#camMsg").innerHTML="這個瀏覽器無法直接開相機，<br>請按「相簿」拍照或選照片。";return false}
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1920}},audio:false});
    const v=$("#video");v.srcObject=stream;await v.play().catch(()=>{});
    $("#camMsg").classList.add("hide");$("#aim").classList.remove("hide");
    $("#btnShoot").setAttribute("aria-label","拍照");return true;
  }catch(e){
    console.warn(e);
    $("#camMsg").classList.remove("hide");
    $("#camMsg").innerHTML="無法開啟相機（"+esc(e.name||"錯誤")+"）。<br>請允許瀏覽器使用相機，或按「相簿」拍照。";
    return false;
  }
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$("#aim").classList.add("hide")}
function toCanvas(src,w,h,M){
  M=M||1280;const s=Math.min(1,M/Math.max(w,h));
  const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);return c;
}
/* 相機畫面是 object-fit:cover，先算出畫面上看得到的範圍 */
async function fromVideo(){
  const v=$("#video");
  if(!stream||!v.videoWidth){const ok=await openCam();if(!ok)return null;await new Promise(r=>setTimeout(r,400))}
  if(!v.videoWidth)return null;
  const vw=v.videoWidth,vh=v.videoHeight,r=v.clientWidth/v.clientHeight;
  let sw=vw,sh=vh;if(vw/vh>r)sw=vh*r;else sh=vw/r;
  // 只取取景框（寬 84%、高 40%）四周再多留一點
  const cx=(vw-sw)/2+sw*.04,cy=(vh-sh)/2+sh*.26,cw=sw*.92,ch=sh*.48;
  const full=document.createElement("canvas");full.width=Math.round(cw);full.height=Math.round(ch);
  full.getContext("2d").drawImage(v,cx,cy,cw,ch,0,0,full.width,full.height);
  return toCanvas(full,full.width,full.height);
}
function fromFile(file){
  return new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{const c=toCanvas(img,img.naturalWidth,img.naturalHeight);URL.revokeObjectURL(url);res(c)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("讀不到這張照片"))};
    img.src=url;
  });
}

/* 第 n 次複習完成後隔幾天再複習：漸進 1→2→3→3→3，或固定 1～3 天 */
function gapDays(doneCount){
  const g=PROFILE?PROFILE.review_gap:0;
  if(g>=1&&g<=3)return g;
  return [1,2,3,3,3][Math.min(doneCount,4)];
}
const isDue=f=>f.review_count<MAX_REVIEW&&f.next_review_at&&Date.parse(f.next_review_at)<=Date.now();

  const n=FAVS.filter(f=>f.user_id===(AUTH&&AUTH.uid)&&isDue(f)).length;
  const b=$("#dueBadge");b.textContent=n;b.classList.toggle("hide",!n);
  return n;
}

async function renderReview(){
  const body=$("#revBody");
  if(!AUTH){body.innerHTML=`<div class="empty">登入後，系統會依排程（每 1～3 天）提醒你複習收藏的照片，每張最多複習 ${MAX_REVIEW} 次。<br><br><button class="btn pri" id="rvLogin">登入／註冊</button></div>`;$("#rvLogin").onclick=()=>openAuth("login");return}
  if(REV&&REV.idx<REV.list.length)return drawRevCard();
  const due=FAVS.filter(isDue);
  const doing=FAVS.filter(f=>f.review_count<MAX_REVIEW&&!isDue(f)).sort((a,b)=>Date.parse(a.next_review_at)-Date.parse(b.next_review_at));
  const done=FAVS.filter(f=>f.review_count>=MAX_REVIEW).length;
  const gapTxt=(PROFILE&&PROFILE.review_gap)?`每 ${PROFILE.review_gap} 天`:"漸進（隔 1、2、3 天）";
  body.innerHTML=`<div class="card">
      <h2 style="font-size:18px;margin:0 0 6px">🔁 今日複習</h2>
      ${REV&&REV.done?`<p>👏 剛剛完成 ${REV.done} 張複習！</p>`:""}
      <p>${due.length?`今天有 <b>${due.length}</b> 張照片要複習。先看照片想想怎麼唸，再翻開答案。`:"今天沒有要複習的照片 🎉"}</p>
      <div class="row">${due.length?`<button class="btn pri" id="rvStart">開始複習</button>`:""}<button class="btn" id="rvSet">⚙️ 複習間隔：${gapTxt}</button></div>
    </div>
    <div class="card"><div class="row"><span class="grow">收藏 ${FAVS.length} 張・複習中 ${due.length+doing.length} 張・已完成 ${done} 張</span></div>
      ${doing.length?`<p class="muted" style="margin:10px 0 4px">接下來的複習</p><div class="tbl"><table><tr><th>文字</th><th>已複習</th><th>下次</th></tr>${doing.slice(0,12).map(f=>`<tr><td>${esc(f.word)}</td><td>${dotsHTML(f.review_count)}</td><td>${fmtD(f.next_review_at)}</td></tr>`).join("")}</table></div>`:""}
    </div>`;
  REV=null;
  const st=$("#rvStart");if(st)st.onclick=async()=>{unlockAudio();try{await loadDict()}catch(e){toast("辭典載入失敗，請檢查網路");return}REV={list:due.slice(),idx:0,done:0,shown:false};drawRevCard()};
  $("#rvSet").onclick=openAccount;
}
async function drawRevCard(){
  const f=REV.list[REV.idx];
  await signPhotos([f.image_path]);
  const d=REV.d||f.dialect||DIALECT;
  const head=`<div class="row"><span class="grow muted" style="text-align:left">第 ${REV.idx+1} / ${REV.list.length} 張・這張第 ${f.review_count+1} 次複習</span><button class="btn sm ghost" id="rvQuit">結束</button></div>
     <div class="prog"><i style="width:${REV.idx/REV.list.length*100}%"></i></div>`;
  if(!REV.shown){
    $("#revBody").innerHTML=`<div class="card revcard">${head}${photoHTML(photoUrl(f.image_path),f.box)}
      <p>🤔 框框裡的字，用${DN(d)}怎麼唸？</p>
      <button class="btn pri" id="rvShow">👀 看答案</button></div>`;
    $("#rvShow").onclick=()=>{unlockAudio();REV.shown=true;drawRevCard()};
  }else{
    $("#revBody").innerHTML=`<div class="card revcard">${head}<div class="res">${resultHTML(f.word,d,photoHTML(photoUrl(f.image_path),f.box))}</div>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn pri" id="rvOk">✅ 記住了，下一張</button></div></div>`;
    bindResult($("#revBody"),f.word,d,(nd,p)=>{REV.d=nd;drawRevCard()});
    $("#rvOk").onclick=async()=>{
      $("#rvOk").disabled=true;
      try{await markReviewed(FAVS.find(x=>x.id===f.id)||f);REV.done++;REV.idx++;REV.shown=false;REV.d=null;stopAll();renderReview()}
      catch(e){toast(zhErr(e));$("#rvOk").disabled=false}
    };
    autoSay($("#revBody"));
  }
  $("#rvQuit").onclick=()=>{stopAll();REV.idx=REV.list.length;renderReview()};
}

/* ================= 群組 ================= */
let GROUPS=[];   // [{id,name,join_code,owner_id,role}]
async function loadGroups(){
  if(!AUTH){GROUPS=[];return}
  try{
    const rows=await api("hakkaocr_group_members?select=role,hakkaocr_groups(id,name,join_code,owner_id,created_at)&user_id=eq."+AUTH.uid);
    GROUPS=rows.filter(r=>r.hakkaocr_groups).map(r=>Object.assign({role:r.role},r.hakkaocr_groups)).sort((a,b)=>a.created_at<b.created_at?-1:1);
  }catch(e){console.warn(e)}
}
const ROLE={owner:"擁有者",admin:"管理員",member:"成員"};
async function renderGroups(){
  const body=$("#grpBody");
  if(!AUTH){body.innerHTML=`<div class="empty">登入後可以建立群組（例如班級、家庭），<br>邀請成員加入、分享收藏照片，管理者還能看到每位成員的複習進度。<br><br><button class="btn pri" id="gLogin">登入／註冊</button></div>`;$("#gLogin").onclick=()=>openAuth("login");return}
  body.innerHTML=`<div class="busy"><div class="spin"></div>載入中…</div>`;
  await loadGroups();
  body.innerHTML=`<div class="card">
      <h2 style="font-size:18px;margin:0 0 8px">👥 我的群組</h2>
      ${GROUPS.length?GROUPS.map(g=>`<button class="btn" style="width:100%;text-align:left;margin:4px 0" data-g="${g.id}"><b>${esc(g.name)}</b> <span class="muted">・${ROLE[g.role]}</span></button>`).join(""):`<p class="muted">還沒有加入任何群組。</p>`}
    </div>
    <div class="card">
      <label class="f" for="gName">建立新群組</label>
      <div class="row"><input class="f grow" id="gName" maxlength="40" placeholder="例如：三年甲班、陳家客語角" style="width:auto"><button class="btn pri" id="gCreate">建立</button></div>
      <label class="f" for="gCode">用邀請代碼加入群組</label>
      <div class="row"><input class="f grow" id="gCode" maxlength="12" placeholder="6 碼代碼" style="width:auto;text-transform:uppercase"><button class="btn" id="gJoin">加入</button></div>
      <div class="err" id="gMsg"></div>
    </div>`;
  body.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>renderGroup(b.dataset.g));
  $("#gCreate").onclick=async()=>{
    const name=$("#gName").value.trim();if(!name){$("#gMsg").textContent="請輸入群組名稱";return}
    try{const g=await rpc("hakkaocr_create_group",{p_name:name});toast("已建立群組「"+name+"」");renderGroup(g.id)}catch(e){$("#gMsg").textContent=zhErr(e)}
  };
  $("#gJoin").onclick=async()=>{
    const code=$("#gCode").value.trim();if(!code){$("#gMsg").textContent="請輸入邀請代碼";return}
    try{const g=await rpc("hakkaocr_join_group",{p_code:code});toast("已加入「"+g.name+"」");renderGroup(g.id)}catch(e){$("#gMsg").textContent=zhErr(e)}
  };
}
async function renderGroup(gid){
  const body=$("#grpBody");
  body.innerHTML=`<div class="busy"><div class="spin"></div>載入中…</div>`;
  await loadGroups();
  const g=GROUPS.find(x=>x.id===gid);
  if(!g){renderGroups();return}
  const mgr=g.role==="owner"||g.role==="admin";
  let members=[],album=[];
  try{
    if(mgr)members=await rpc("hakkaocr_group_progress",{p_group:gid});
    else{
      const ms=await api("hakkaocr_group_members?select=user_id,role&group_id=eq."+gid);
      const ps=ms.length?await api("hakkaocr_profiles?select=user_id,display_name&user_id=in.("+ms.map(m=>m.user_id).join(",")+")"):[];
      members=ms.map(m=>({user_id:m.user_id,role:m.role,display_name:(ps.find(p=>p.user_id===m.user_id)||{}).display_name||"（未設定名稱）"}));
    }
    album=await api("hakkaocr_favorites?select=*&group_id=eq."+gid+"&order=created_at.desc&limit=300");
  }catch(e){toast(zhErr(e))}
  const nameOf=uid=>{const m=members.find(x=>x.user_id===uid);return m?m.display_name:""};
  body.innerHTML=`<div class="row" style="margin-top:12px"><button class="btn sm" id="gBack">← 群組列表</button></div>
    <div class="card">
      <h2 style="font-size:18px;margin:0">${esc(g.name)}</h2>
      <p class="muted" style="margin:4px 0">我的角色：${ROLE[g.role]}・成員 ${members.length} 人</p>
      ${mgr?`<div class="row"><span>邀請代碼：<b style="font-size:20px;letter-spacing:2px">${esc(g.join_code)}</b></span><button class="btn sm" id="gCopy">複製</button><button class="btn sm" id="gNew">換新代碼</button></div><p class="muted">把代碼給成員，他們在「群組」頁輸入即可加入。</p>`:""}
    </div>
    <div class="card"><h3 style="font-size:16px;margin:0 0 6px">成員${mgr?"與複習進度":""}</h3><div class="tbl"><table>
      <tr><th>名稱</th><th>角色</th>${mgr?"<th>收藏</th><th>完成</th><th>待複習</th><th></th>":""}</tr>
      ${members.map(m=>`<tr><td>${esc(m.display_name)}${mgr&&m.email?`<br><span class="muted">${esc(m.email)}</span>`:""}</td><td>${ROLE[m.role]}</td>
        ${mgr?`<td>${m.favorites}</td><td>${m.finished}</td><td>${m.due?`<span class="due">${m.due}</span>`:0}</td><td style="white-space:nowrap">${memberActions(g,m)}</td>`:""}</tr>`).join("")}
    </table></div></div>
    <div class="card"><h3 style="font-size:16px;margin:0 0 6px">📷 群組相簿（${album.length}）</h3>
      ${album.length?`<div class="grid" id="gAlbum">${album.map(f=>favCard(f,nameOf(f.user_id))).join("")}</div>`:`<p class="muted">在「我的最愛」打開照片，選擇「分享到群組相簿」，大家就能一起看、一起聽。</p>`}
    </div>
    <div class="row" style="margin-bottom:12px">${g.role==="owner"?`<button class="btn danger sm" id="gDel">刪除群組</button>`:`<button class="btn danger sm" id="gLeave">退出群組</button>`}</div>`;
  $("#gBack").onclick=renderGroups;
  if(mgr){
    $("#gCopy").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(g.join_code).then(()=>toast("已複製代碼"),()=>toast("代碼："+g.join_code))};
    $("#gNew").onclick=async()=>{if(!confirm("換新代碼後，舊代碼就不能再用來加入。確定？"))return;try{await rpc("hakkaocr_new_code",{p_group:gid});renderGroup(gid)}catch(e){toast(zhErr(e))}};
  }
  body.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{
    const [act,uid]=b.dataset.act.split(":");
    try{
      if(act==="kick"){if(!confirm("確定把「"+nameOf(uid)+"」移出群組？"))return;await api("hakkaocr_group_members?group_id=eq."+gid+"&user_id=eq."+uid,{method:"DELETE"})}
      else await rpc("hakkaocr_set_role",{p_group:gid,p_user:uid,p_role:act});
      renderGroup(gid);
    }catch(e){toast(zhErr(e))}
  });
  const alb=$("#gAlbum");
  if(alb){
    alb.onclick=e=>{const b=e.target.closest("[data-fav]");if(b)openFav(album.find(f=>f.id===b.dataset.fav),{autoplay:true})};
    await signPhotos(album.map(f=>f.image_path));
    alb.querySelectorAll("[data-img]").forEach(el=>{const u=photoUrl(el.dataset.img);if(u)el.style.backgroundImage=`url("${u}")`});
  }
  const del=$("#gDel");if(del)del.onclick=async()=>{if(!confirm("確定刪除群組「"+g.name+"」？成員的收藏不會被刪除，但會取消分享。"))return;try{await api("hakkaocr_groups?id=eq."+gid,{method:"DELETE"});toast("群組已刪除");renderGroups()}catch(e){toast(zhErr(e))}};
  const lv=$("#gLeave");if(lv)lv.onclick=async()=>{if(!confirm("確定退出群組「"+g.name+"」？"))return;try{await api("hakkaocr_group_members?group_id=eq."+gid+"&user_id=eq."+AUTH.uid,{method:"DELETE"});toast("已退出群組");renderGroups()}catch(e){toast(zhErr(e))}};
}
function memberActions(g,m){
  if(m.user_id===AUTH.uid||m.role==="owner")return "";
  const out=[];
  if(g.role==="owner")out.push(m.role==="admin"?`<button class="btn sm" data-act="member:${m.user_id}">取消管理員</button>`:`<button class="btn sm" data-act="admin:${m.user_id}">設為管理員</button>`);
  if(g.role==="owner"||(g.role==="admin"&&m.role==="member"))out.push(`<button class="btn sm danger" data-act="kick:${m.user_id}">移出</button>`);
  return out.join(" ");
}

/* ================= 分頁 ================= */
function showTab(t){
  curTab=t;stopAll();
  ["vCam","vFav","vRev","vGrp"].forEach(x=>$("#"+x).classList.toggle("hide",x!==t));
  document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.tab===t)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(t!=="vCam")stopCam();
  else if($("#resBox").classList.contains("hide")&&camWanted)openCam();
  if(t==="vFav")renderFavs();
  if(t==="vRev")renderReview();
  if(t==="vGrp")renderGroups();
  window.scrollTo(0,0);
}
document.querySelector("nav.tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(b)showTab(b.dataset.tab)};

/* ================= 拍照按鈕 ================= */
let camWanted=false;
$("#btnShoot").onclick=async()=>{
  unlockAudio();
  if(!stream){camWanted=true;await openCam();return}
  const c=await fromVideo();if(c)handleCanvas(c);
};
$("#btnFlip").onclick=()=>{facing=facing==="environment"?"user":"environment";camWanted=true;openCam()};
$("#file").onchange=async e=>{
  unlockAudio();
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{handleCanvas(await fromFile(f))}catch(err){toast(err.message)}
};
$("#camMsg").onclick=()=>$("#btnShoot").click();
$("#btnType").onclick=()=>{unlockAudio();handleText($("#typeIn").value)};
$("#typeIn").onkeydown=e=>{if(e.key==="Enter"){unlockAudio();handleText($("#typeIn").value)}};

/* ================= 啟動 ================= */
(async()=>{
  // 驗證信或重設密碼信回來時，網址會帶 access_token
  const hp=new URLSearchParams(location.hash.slice(1));
  if(hp.get("access_token")){
    applySession({access_token:hp.get("access_token"),refresh_token:hp.get("refresh_token"),expires_in:+hp.get("expires_in")||3600});
    try{const u=await authCall("user",undefined,"GET",AUTH.access).catch(()=>null);if(u){AUTH.uid=u.id;AUTH.email=u.email;lsSet("ho_auth",AUTH)}}catch(e){}
    history.replaceState(null,"",location.pathname+location.search);
    if(hp.get("type")==="recovery")setTimeout(()=>{
      openModal(`<h2>設定新密碼 <button class="btn sm ghost" data-close>✕</button></h2><input class="f" id="npw" type="password" minlength="6" placeholder="新密碼（至少 6 個字元）"><div class="err" id="npMsg"></div><button class="btn pri" id="npGo">更新密碼</button>`);
      $("#npGo").onclick=async()=>{try{await authCall("user",{password:$("#npw").value},"PUT",AUTH.access);closeModal();toast("密碼已更新")}catch(e){$("#npMsg").textContent=zhErr(e)}};
    },300);
  }
  refreshAuthUI();
  loadOCR().catch(()=>{});
  loadDict().catch(()=>toast("辭典載入失敗，請檢查網路"));
  if(AUTH&&await ensureToken()){await loadProfile();await loadFavs();refreshAuthUI();loadGroups();
    const n=updateDue();if(n)toast("🔔 今天有 "+n+" 張照片要複習");}
})();
</script>
