<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拍照學客語管理</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#b4492b">
<link rel="stylesheet" href="style.css">
<style>
body{padding-bottom:24px}
.wrap.wide{max-width:1080px}
.atabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.atabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px}
.atabs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:26px;line-height:1.2}
.kpi span{font-size:13px;color:var(--sub)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--chip)}
.bar{display:inline-block;height:10px;border-radius:3px;background:var(--brand);vertical-align:middle;min-width:1px}
.bar.b2{background:var(--zh)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.citem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.citem .thumb{max-height:200px}
.citem input.f,.citem textarea.f{min-height:36px;padding:6px 8px}
.citem label.f{margin:6px 0 2px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center}
.log{font-size:13px;white-space:pre-wrap;background:var(--chip);border-radius:10px;padding:8px;max-height:240px;overflow:auto}
</style>
</head>
<body>
<header><div class="wrap wide">
  <h1>🛠️ 拍照學客語・管理</h1>
  <a class="btn sm" href="./">← 回網站</a>
  <button id="btnAuth" class="btn sm">登入</button>
</div></header>

<main class="wrap wide">
  <div id="gate" class="empty">載入中…</div>
  <div id="app" class="hide">
    <div class="atabs" role="tablist">
      <button data-v="stats" aria-pressed="true">📊 統計</button>
      <button data-v="contrib" aria-pressed="false">📮 投稿審核</button>
      <button data-v="data" aria-pressed="false">💾 資料下載／上傳</button>
      <button data-v="users" aria-pressed="false">👤 使用者</button>
    </div>
    <section id="v-stats"></section>
    <section id="v-contrib" class="hide"></section>
    <section id="v-data" class="hide"></section>
    <section id="v-users" class="hide"></section>
  </div>
  <footer>© 2026 鑫宥嘉有限公司</footer>
</main>

<div class="modal hide" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="core.js"></script>
<script src="../objcam/vocab.js"></script>
<script src="admin.js"></script>
</body>
</html>
